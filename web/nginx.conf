server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: qualquer rota do React cai no index.html. Sem isso, abrir
    # /highscores direto (ou dar F5 nela) devolve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos do Vite levam hash no nome, entao podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
