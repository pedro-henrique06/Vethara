# Sobreposição de produção. Use SEMPRE junto com o compose base:
#
#   docker compose -f docker/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# O que muda em relação ao base:
#   - imagem do servidor fixada por digest (o base usa :latest, que troca sozinho)
#   - Caddy na frente, com HTTPS automático via Let's Encrypt
#
# O site e o login deixam de ser publicados para a internet: o Caddy fala com eles
# pela rede interna do Docker. Ficam em 127.0.0.1 para depuração de dentro do VPS.
# Nao dependemos do firewall para isso — o Docker escreve direto no iptables e passa
# por cima do ufw, entao portas publicadas ficam abertas mesmo com o ufw configurado.

services:
  # Imagem propria: o Canary oficial mais as taxas do Vethara (respawn, exp e
  # velocidade base). Ver servidor/Dockerfile, onde tambem fica fixado o digest
  # do Canary — trocar o sha256 de la e como se atualiza o servidor.
  server:
    build: ../servidor
    image: vethara-canary:local

  # O banco nao e publicado pelo compose base. Aqui ele passa a escutar apenas em
  # 127.0.0.1 do VPS, o suficiente para um tunel SSH (DBeaver e afins). De fora
  # continua inalcancavel: quem quiser conectar precisa antes ter acesso SSH.
  db:
    ports:
      - '127.0.0.1:${CANARY_DB_PORT:-3306}:3306'

  login-server:
    image: opentibiabr/login-server@sha256:41a47cb190be3bf35d1344b2f51c543071f16787c3d4f0f7e330e9a9d0618f49
    # !override troca a lista inteira; sem ele o compose soma as duas e a porta
    # publica continuaria aberta. A 9090 (gRPC interno) sai de vez.
    ports: !override
      - '127.0.0.1:${LOGIN_HTTP_PORT:-8088}:${LOGIN_HTTP_PORT:-8088}'

  myaac:
    ports: !override
      - '127.0.0.1:${MYAAC_HTTP_PORT:-8080}:80'

  # Site novo: API em .NET e front em React. O MyAAC continua rodando, mas
  # so responde em /aac — e a rede de seguranca ate a criacao de conta migrar.
  api:
    build: ../api
    restart: unless-stopped
    environment:
      CANARY_DB_HOST: "${CANARY_DB_HOST:-db}"
      CANARY_DB_PORT: "${CANARY_DB_PORT:-3306}"
      CANARY_DB_NAME: "${CANARY_DB_NAME:-canary}"
      CANARY_DB_USER: "${CANARY_DB_USER:-canary}"
      CANARY_DB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      CANARY_SERVER_NAME: "${CANARY_SERVER_NAME:-Vethara}"
      VETHARA_JWT_SECRET: "${VETHARA_JWT_SECRET:-}"
      VETHARA_DOMAIN: "${VETHARA_DOMAIN:?defina VETHARA_DOMAIN no .env}"
      VETHARA_CLIENT_DIR: /client
    volumes:
      # So leitura: a API calcula o CRC32 desses arquivos para o manifesto do
      # updater, e nao tem motivo nenhum para escrever neles.
      - '../client:/client:ro'
    networks:
      - canary-net
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../web
    restart: unless-stopped
    networks:
      - canary-net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    command: caddy run --config /etc/caddy-conf/Caddyfile --adapter caddyfile
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      VETHARA_DOMAIN: "${VETHARA_DOMAIN:?defina VETHARA_DOMAIN no .env}"
    volumes:
      # Monta o DIRETORIO, nao o arquivo. Bind mount de arquivo unico aponta para
      # o inode: quando o git pull substitui o Caddyfile (escreve novo + renomeia),
      # o container continua vendo o inode antigo, ja orfao. O reload roda sem erro
      # e aplica a versao velha — sintoma dificil de diagnosticar.
      - '../deploy:/etc/caddy-conf:ro'
      - '../download:/srv/download:ro'
      - '../client:/srv/client:ro'
      - 'caddy-data:/data'
      - 'caddy-config:/config'
    networks:
      - canary-net
    depends_on:
      - web
      - api
      - myaac
      - login-server

volumes:
  caddy-data:
  caddy-config:
